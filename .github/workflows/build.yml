name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev fakeroot

      - name: Build the .deb
        run: ./packaging/build_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows .exe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the .exe
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Zip the PyInstaller folder
        shell: pwsh
        run: Compress-Archive -Path dist\WinIso-NG\* -DestinationPath dist\WinIso-NG-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/WinIso-NG-windows-x64.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p assets
          find artifacts -name '*.deb' -exec cp {} assets/ \;
          find artifacts -name '*.zip' -exec cp {} assets/ \;

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
