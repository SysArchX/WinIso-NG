[metadata]
name = winiso-ng
version = 0.1.0
author = SysArchX
description = WinIso-NG is a Linux tool that enables you to create your own bootable Windows USB installer from an ISO image or a real DVD. It is based on WoeUSB-ng.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/SysArchX/WinIso-NG
project_urls =
    Bug Tracker = https://github.com/SysArchX/WinIso-NG/issues
classifiers =
    Development Status :: 5 - Production/Stable
	Environment :: X11 Applications :: GTK
	Intended Audience :: End Users/Desktop
	License :: OSI Approved
	 :: GNU General Public License v3 or later (GPLv3+)
	Operating System :: POSIX
	Programming Language :: Python
	Programming Language :: Python :: 3
	Programming Language :: Python :: 3.5
	Programming Language :: Python :: 3.6
	Programming Language :: Python :: 3.7
	Programming Language :: Python :: 3.8
	Programming Language :: Python :: 3 :: Only
	Topic :: System :: Operating System

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
gui_scripts =
	winisogui = WinIso.gui:run
console_scripts = 
	winiso = WinIso.core:run
